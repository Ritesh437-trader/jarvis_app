name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android folder
        run: flutter create --platforms=android --org com.jarvis.app --project-name jarvis_app .
      - name: Add permissions
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<manifest[^>]*>/s//&\n<uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n<uses-permission android:name="android.permission.INTERNET"\/>\n<queries><intent><action android:name="android.speech.RecognitionService"\/><\/intent><intent><action android:name="android.intent.action.VIEW"\/><data android:scheme="https"\/><\/intent><\/queries>/' $F
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: build/app/outputs/flutter-apk/app-release.apk
